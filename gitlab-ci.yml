
stages:
  - validate
  - deploy

# ==========================================
# PYTHON VALIDATION
# ==========================================

python-validation:

  stage: validate

  image: python:3.11

  only:
    - /^feature\/.*$/
    - Develop
    - main

  before_script:
    - pip install -r requirements.txt

  script:
    - python -m py_compile app.py
    - echo "Python validation successful"

# ==========================================
# TERRAFORM VALIDATION
# ==========================================

terraform-validation:

  stage: validate

  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]

  only:
    - /^feature\/.*$/
    - Develop
    - main

  script:
    - cd Terraform
    - terraform init
    - terraform fmt -check
    - terraform validate


